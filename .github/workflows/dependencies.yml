name: Xcode Dependencies
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  dependencies:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Resolve Dependencies
        id: resolution
        uses: GetSidetrack/action-xcodeproj-spm-update@0.3.0
        with:
          forceResolution: true
          failWhenOutdated: false
          xcodePath: '/Applications/Xcode_26.5.app'
      - name: Resolve EhPandaKit Dependencies
        env:
          DEVELOPER_DIR: '/Applications/Xcode_26.5.app'
        run: swift package update --package-path Packages/EhPandaKit
      - name: Detect changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        if: steps.resolution.outputs.dependenciesChanged == 'true' || steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: 'update-dependencies'
          delete-branch: true
          commit-message: 'Update dependencies [skip test]'
          title: 'Updated Dependencies'
